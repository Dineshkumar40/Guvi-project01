version: 0.2

phases:

  pre_build:
    commands:
      - echo "=========================================="
      - echo "CodeBuild 1 - Docker Build and ECR Push"
      - echo "=========================================="

      - echo "AWS Region: $AWS_DEFAULT_REGION"
      - echo "Account ID: $AWS_ACCOUNT_ID"
      - echo "Repository: $IMAGE_REPO_NAME"

      - echo "Git Commit SHA:"
      - echo "$CODEBUILD_RESOLVED_SOURCE_VERSION"

      - export IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "Docker Image Tag: $IMAGE_TAG"

      - echo "Logging in to Amazon ECR..."

      - aws ecr get-login-password \
          --region $AWS_DEFAULT_REGION | \
          docker login \
          --username AWS \
          --password-stdin \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com


  build:
    commands:
      - echo "=========================================="
      - echo "Building Docker Image"
      - echo "=========================================="

      - echo "Build started on:"
      - date

      - echo "Building image..."

      - docker build \
          -t $IMAGE_REPO_NAME:$IMAGE_TAG .

      - echo "Tagging image for ECR..."

      - docker tag \
          $IMAGE_REPO_NAME:$IMAGE_TAG \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG


  post_build:
    commands:
      - echo "=========================================="
      - echo "Pushing Docker Image to ECR"
      - echo "=========================================="

      - echo "Pushing image..."

      - docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

      - echo "=========================================="
      - echo "Docker image pushed successfully"
      - echo "=========================================="

      - echo "Image:"
      - echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG"